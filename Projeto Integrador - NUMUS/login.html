<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Numus</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <a href="index.html"><img src="images/logo-numus.svg" alt="Numus Logo"></a>
        <div class="header-buttons">
            <a href="criar-conta.html" class="btn-criar">Criar uma conta</a>
            <a href="login.html" class="btn-entrar">Entrar</a>
        </div>
    </header>

    <!-- CONTAINER CENTRAL -->
    <section class="login-wrapper">
        <div class="login-card">

            <!-- LADO ESQUERDO -->
            <div class="login-left">
                <img src="images/logo.png" alt="Numus Logo" class="mini-logo">
                <h2>De volta à organização.<br>Qual é a sua meta de hoje?</h2>
            </div>

            <!-- LINHA VERTICAL -->
            <div class="divider"></div>

            <!-- LADO DIREITO -->
            <div class="login-right">
                <h2>Entrar na sua conta</h2>

                <label>Digite seu email</label>
                <input type="email" placeholder="Email">

                <label>Digite sua senha</label>
                <input type="password" placeholder="Senha">

                <button class="btn-entrar-form">Entrar</button>
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer-login">
        Desenvolvido para fins educacionais
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numus – Criar Conta</title>
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <a href="index.html"><img src="images/logo-numus.svg" alt="Numus Logo"></a>
        <div class="header-buttons">
            <a href="criar-conta.html" class="btn-criar">Criar uma conta</a>
            <a href="login.html" class="btn-entrar">Entrar</a>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <section class="login-wrapper">
        <div class="login-card">

            <!-- LADO ESQUERDO -->
            <div class="login-left">
                <img src="images/logo.png" alt="Numus Logo" class="mini-logo">
                <h2>Sua vida financeira merece clareza.</h2>
            </div>

            <!-- LINHA VERTICAL -->
            <div class="divider"></div>

            <!-- LADO DIREITO -->
            <div class="login-right">
                <h2>Comece a construir seu<br>futuro financeiro</h2>

                    <label>Digite seu nome</label>
                    <input type="text" placeholder="Nome">

                    <label>Digite seu email</label>
                    <input type="email" placeholder="Email">

                    <label>Digite sua senha</label>
                    <input type="password" placeholder="Senha">

                    <label>Digite novamente sua senha</label>
                    <input type="password" placeholder="Senha">

                    <button class="btn-entrar-form">Criar conta</button>

            </div>

        </section>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        Desenvolvido para fins educacionais
    </footer>

</body>
</html>
